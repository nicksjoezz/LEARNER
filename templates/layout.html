<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoRun Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; overflow-x: hidden; }
        .trading-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; }
        .btn-primary { background-color: #238636; transition: 0.2s; }
        .btn-primary:hover { background-color: #2ea043; }
        .btn-danger { background-color: #da3633; transition: 0.2s; }
        .btn-danger:hover { background-color: #f85149; }
        .active-glow { box-shadow: 0 0 15px rgba(35, 134, 54, 0.4); }
        .balance-pulse { animation: pulse-green 1s; }
        @keyframes pulse-green {
            0% { color: #fff; }
            50% { color: #2ea043; transform: scale(1.05); }
            100% { color: #fff; }
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #238636;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen">
    <nav class="border-b border-[#30363d] p-4 bg-[#161b22]">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fas fa-robot text-green-500 text-2xl"></i>
                <span class="text-xl font-bold tracking-tight">AlgoRun <span class="text-green-500 text-sm">v2.0</span></span>
            </div>
            <div class="space-x-6 flex items-center">
                <a href="/" class="hover:text-white"><i class="fas fa-chart-line mr-1"></i> Dashboard</a>
                <a href="/settings" class="hover:text-white"><i class="fas fa-cog mr-1"></i> Settings</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 hidden transform translate-y-10 transition-all duration-300 z-50">
        <div class="bg-green-600 text-white px-6 py-3 rounded-lg shadow-2xl flex items-center space-x-3">
            <i class="fas fa-check-circle"></i>
            <span id="toast-msg"></span>
        </div>
    </div>

    <script>
        const socket = io();
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');

        socket.on('notify', (data) => {
            toastMsg.innerText = data.msg;
            toast.classList.remove('hidden', 'translate-y-10');
            setTimeout(() => {
                toast.classList.add('translate-y-10');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3000);
        });
    </script>
</body>
</html>
